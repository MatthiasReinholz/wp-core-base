name: wp-core-base Update Reconciliation

on:
  pull_request_target:
    types:
      - closed
  workflow_dispatch:
  schedule:
    - cron: '43 */12 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: wp-core-base-dependency-sync
  cancel-in-progress: false

jobs:
  cleanup:
    if: >
      github.event_name == 'pull_request_target' &&
      (
        contains(github.event.pull_request.labels.*.name, 'automation:dependency-update') ||
        contains(github.event.pull_request.labels.*.name, 'automation:framework-update')
      )
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Clean up managed branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: php tools/wporg-updater/bin/wporg-updater.php managed-pr-cleanup --pr-number=${{ github.event.pull_request.number }}

  sync:
    timeout-minutes: 30
    if: >
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
      ) ||
      (
        github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'automation:dependency-update') ||
        contains(github.event.pull_request.labels.*.name, 'automation:framework-update')
      )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: php tools/wporg-updater/bin/wporg-updater.php sync --report-json=.wp-core-base/build/sync-report.json --fail-on-source-errors

      - name: Publish sync summary
        if: ${{ always() }}
        run: php tools/wporg-updater/bin/wporg-updater.php render-sync-report --report-json=.wp-core-base/build/sync-report.json --summary-path="${GITHUB_STEP_SUMMARY}"

      - name: Sync source-failure issue
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: php tools/wporg-updater/bin/wporg-updater.php sync-report-issue --report-json=.wp-core-base/build/sync-report.json
