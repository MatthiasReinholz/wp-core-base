name: finalize-wp-core-base-release

on:
  pull_request_target:
    types:
      - closed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  pull-requests: read
  actions: read
  security-events: read

concurrency:
  group: wp-core-base-release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish merged wp-core-base release
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.pull_request.head.ref }}
      SOURCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Derive release version
        id: release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "plain=${BASH_REMATCH[1]#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unsupported release branch: $HEAD_REF" >&2
          exit 1

      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: php tools/wporg-updater/bin/wporg-updater.php release-verify --repo-root=. --tag="$RELEASE_VERSION"

      - name: Verify merged release PR passed CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
          bash scripts/ci/check_framework_release_ci.sh "${GITHUB_REPOSITORY}" "${RELEASE_TAG#release/}" "$SOURCE_COMMIT"

      - name: Verify exact-revision security review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          php scripts/ci/check_security_review.php --github --commit="$SOURCE_COMMIT" --wait-seconds=1200 \
            | tee "${RUNNER_TEMP}/wp-core-base-security-review.json"
          {
            echo '### Security review (known runtime findings remain open)'
            echo '```json'
            cat "${RUNNER_TEMP}/wp-core-base-security-review.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build vendored framework snapshot
        run: |
          php tools/wporg-updater/bin/wporg-updater.php build-release-artifact \
            --repo-root=. \
            --source-revision="$SOURCE_COMMIT" \
            --output=dist/wp-core-base-vendor-snapshot.zip \
            --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256

      - name: Sign release checksum sidecar
        env:
          WP_CORE_BASE_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.WP_CORE_BASE_RELEASE_PRIVATE_KEY_PEM }}
          WP_CORE_BASE_RELEASE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.WP_CORE_BASE_RELEASE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          php tools/wporg-updater/bin/wporg-updater.php release-sign \
            --artifact=dist/wp-core-base-vendor-snapshot.zip \
            --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256 \
            --signature-file=dist/wp-core-base-vendor-snapshot.zip.sha256.sig \
            --private-key-env=WP_CORE_BASE_RELEASE_PRIVATE_KEY_PEM \
            --passphrase-env=WP_CORE_BASE_RELEASE_PRIVATE_KEY_PASSPHRASE

      - name: Verify release artifact
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          php tools/wporg-updater/bin/wporg-updater.php release-verify \
            --repo-root=. \
            --tag="$RELEASE_VERSION" \
            --artifact=dist/wp-core-base-vendor-snapshot.zip \
            --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256 \
            --signature-file=dist/wp-core-base-vendor-snapshot.zip.sha256.sig

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish verified release with ownership receipts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_PLAIN: ${{ steps.release.outputs.plain }}
        run: |
          bash scripts/ci/publish_framework_release.sh \
            "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$SOURCE_COMMIT" \
            "docs/releases/${RELEASE_PLAIN}.md" \
            dist/wp-core-base-vendor-snapshot.zip \
            dist/wp-core-base-vendor-snapshot.zip.sha256 \
            dist/wp-core-base-vendor-snapshot.zip.sha256.sig \
            "${RUNNER_TEMP}/wp-core-base-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

      - name: Preserve publication receipts in job summary
        if: always()
        run: |
          journal="${RUNNER_TEMP}/wp-core-base-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          if [ -f "$journal" ]; then
            {
              echo '### Release publication receipts'
              echo '```json'
              cat "$journal"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
