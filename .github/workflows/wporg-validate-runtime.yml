name: wp-core-base CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php-version: '8.1'
            experimental: false
          - php-version: '8.3'
            experimental: false
          - php-version: '8.4'
            experimental: false
          - php-version: '8.5'
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.4' && 'pcov' || 'none' }}

      - name: Run doctor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: php tools/wporg-updater/bin/wporg-updater.php doctor --repo-root=. --github

      - name: Lint PHP sources
        run: find tools/wporg-updater -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify workflow examples and permissions
        run: php scripts/ci/check_workflow_examples_and_permissions.php

      - name: Run test suite
        env:
          TEST_PHP_VERSION: ${{ matrix.php-version }}
        run: |
          mkdir -p .wp-core-base/build
          export WP_CORE_BASE_TEST_REPORT=.wp-core-base/build/test-report.json
          if [ "$TEST_PHP_VERSION" = '8.4' ]; then
            export WP_CORE_BASE_COVERAGE_FILE=.wp-core-base/build/coverage-observed.json
          fi
          php tools/wporg-updater/tests/run.php

      - name: Check documentation contracts
        run: php scripts/ci/check_documentation.php

      - name: Stage runtime payload
        run: php tools/wporg-updater/bin/wporg-updater.php stage-runtime --repo-root=. --output=.wp-core-base/build/runtime

  quality:
    runs-on: ubuntu-latest
    env:
      QUALITY_TOOLS: .wp-core-base/build/quality-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none

      - name: Install verified pinned quality tools
        run: bash scripts/ci/install_quality_tools.sh "$QUALITY_TOOLS"

      - name: Run actionlint
        run: '"$QUALITY_TOOLS/actionlint" -color'

      - name: Run shellcheck
        run: '"$QUALITY_TOOLS/shellcheck" scripts/ci/*.sh'

      - name: Test release CI helper scripts
        run: bash scripts/ci/test_release_scripts.sh

      - name: Run PHPStan
        run: php "$QUALITY_TOOLS/phpstan.phar" analyse --configuration=phpstan.neon.dist --memory-limit=1G --no-progress

      - name: Check typed policy boundaries
        run: php "$QUALITY_TOOLS/phpstan.phar" analyse --configuration=phpstan-boundaries.neon.dist --memory-limit=1G --no-progress

      - name: Build release verification fixture
        run: |
          php tools/wporg-updater/bin/wporg-updater.php build-release-artifact \
            --repo-root=. \
            --output=dist/wp-core-base-vendor-snapshot.zip \
            --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256

      - name: Sign release verification fixture
        run: |
          PRIVATE_KEY="$(cat tools/wporg-updater/tests/fixtures/release-signing/private.pem)"
          WP_CORE_BASE_RELEASE_TEST_PRIVATE_KEY_PEM="$PRIVATE_KEY" \
            php tools/wporg-updater/bin/wporg-updater.php release-sign \
              --artifact=dist/wp-core-base-vendor-snapshot.zip \
              --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256 \
              --signature-file=dist/wp-core-base-vendor-snapshot.zip.sha256.sig \
              --private-key-env=WP_CORE_BASE_RELEASE_TEST_PRIVATE_KEY_PEM

      - name: Verify release metadata and artifact
        run: |
          php tools/wporg-updater/bin/wporg-updater.php release-verify \
            --repo-root=. \
            --artifact=dist/wp-core-base-vendor-snapshot.zip \
            --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256 \
            --signature-file=dist/wp-core-base-vendor-snapshot.zip.sha256.sig \
            --public-key-file="${GITHUB_WORKSPACE}/tools/wporg-updater/tests/fixtures/release-signing/public.pem"

  downstream-fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile:
          - full-core
          - content-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify downstream fixture
        env:
          FIXTURE_PROFILE: ${{ matrix.profile }}
        run: php scripts/ci/verify_downstream_fixture.php --profile="$FIXTURE_PROFILE"

  wordpress-smoke:
    name: WordPress smoke (${{ matrix.profile }}, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [full-core, content-only]
        php-version: ['8.1', '8.4', '8.5']
    services:
      database:
        image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
        env:
          MARIADB_ROOT_PASSWORD: disposable-root-password
          MARIADB_DATABASE: wp_core_base_smoke
          MARIADB_USER: smoke
          MARIADB_PASSWORD: disposable-smoke-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, mbstring, mysqli, openssl, simplexml, zip
          coverage: none
      - name: Fetch immutable previous baseline for upgrade regression
        run: git fetch --no-tags --depth=1 origin a8f6404fa46befd6d2a8ecd9a3aca940ea05a45c
      - name: Verify staged WordPress runtime
        env:
          SMOKE_PROFILE: ${{ matrix.profile }}
          WP_CORE_BASE_SMOKE_DB_HOST: 127.0.0.1:3306
          WP_CORE_BASE_SMOKE_DB_NAME: wp_core_base_smoke
          WP_CORE_BASE_SMOKE_DB_USER: smoke
          WP_CORE_BASE_SMOKE_DB_PASSWORD: disposable-smoke-password
        run: php scripts/ci/verify_wordpress_runtime.php --profile="$SMOKE_PROFILE"
      - name: Verify seeded store migration and rollback
        env:
          SMOKE_PROFILE: ${{ matrix.profile }}
          WP_CORE_BASE_SMOKE_DB_HOST: 127.0.0.1:3306
          WP_CORE_BASE_SMOKE_DB_NAME: wp_core_base_smoke
          WP_CORE_BASE_SMOKE_DB_USER: smoke
          WP_CORE_BASE_SMOKE_DB_PASSWORD: disposable-smoke-password
        run: |
          for order_storage in hpos posts; do
            php scripts/ci/verify_wordpress_upgrade.php --profile="$SMOKE_PROFILE" --order-storage="$order_storage"
          done
