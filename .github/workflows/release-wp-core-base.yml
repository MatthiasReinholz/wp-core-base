name: release-wp-core-base

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag in vX.Y.Z format'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: wp-core-base-release-release/${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release wp-core-base
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate target version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"

          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use vX.Y.Z format." >&2
            exit 1
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "plain=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag comes from a merged release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          bash scripts/ci/check_framework_release_pr.sh "${GITHUB_REPOSITORY}" "$RELEASE_VERSION" "$COMMIT_SHA"

      - name: Verify merged release PR passed CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          bash scripts/ci/check_framework_release_ci.sh "${GITHUB_REPOSITORY}" "$RELEASE_VERSION" "$COMMIT_SHA"

      - name: Validate release metadata
        run: php tools/wporg-updater/bin/wporg-updater.php release-verify --repo-root=. --tag="$RELEASE_VERSION"

      - name: Build vendored framework snapshot
        run: |
          php tools/wporg-updater/bin/wporg-updater.php build-release-artifact \
            --repo-root=. \
            --source-revision="$(git rev-parse HEAD)" \
            --output=dist/wp-core-base-vendor-snapshot.zip \
            --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256

      - name: Sign release checksum sidecar
        env:
          WP_CORE_BASE_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.WP_CORE_BASE_RELEASE_PRIVATE_KEY_PEM }}
          WP_CORE_BASE_RELEASE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.WP_CORE_BASE_RELEASE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          php tools/wporg-updater/bin/wporg-updater.php release-sign \
            --artifact=dist/wp-core-base-vendor-snapshot.zip \
            --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256 \
            --signature-file=dist/wp-core-base-vendor-snapshot.zip.sha256.sig \
            --private-key-env=WP_CORE_BASE_RELEASE_PRIVATE_KEY_PEM \
            --passphrase-env=WP_CORE_BASE_RELEASE_PRIVATE_KEY_PASSPHRASE

      - name: Verify release artifact
        run: |
          php tools/wporg-updater/bin/wporg-updater.php release-verify \
            --repo-root=. \
            --tag="$RELEASE_VERSION" \
            --artifact=dist/wp-core-base-vendor-snapshot.zip \
            --checksum-file=dist/wp-core-base-vendor-snapshot.zip.sha256 \
            --signature-file=dist/wp-core-base-vendor-snapshot.zip.sha256.sig

      - name: Publish verified release with ownership receipts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          bash scripts/ci/publish_framework_release.sh \
            "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$SOURCE_COMMIT" \
            "docs/releases/${RELEASE_VERSION#v}.md" \
            dist/wp-core-base-vendor-snapshot.zip \
            dist/wp-core-base-vendor-snapshot.zip.sha256 \
            dist/wp-core-base-vendor-snapshot.zip.sha256.sig \
            "${RUNNER_TEMP}/wp-core-base-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

      - name: Preserve publication receipts in job summary
        if: always()
        run: |
          journal="${RUNNER_TEMP}/wp-core-base-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          if [ -f "$journal" ]; then
            {
              echo '### Release publication receipts'
              echo '```json'
              cat "$journal"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
